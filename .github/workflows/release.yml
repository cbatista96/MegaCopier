name: Publicar versión

# Se publica una versión al subir una etiqueta "v1.2.3" que coincida con <Version> de Directory.Build.props.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Comprobar la versión
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "La etiqueta ${{ github.ref_name }} no coincide con la versión $version de Directory.Build.props" }
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Inno Setup
        shell: powershell
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Compilar y probar
        shell: powershell
        run: .\build.ps1

      - name: Exigir la clave pública de actualizaciones
        shell: pwsh
        run: |
          if (-not (Test-Path tools/Updates/public-key.pem)) { throw 'Falta configurar la firma del actualizador: tools/Updates/README.md' }

      - name: Preparar los archivos
        shell: pwsh # PowerShell 7: lee el script en UTF-8 (los acentos de las notas)
        run: |
          $out = New-Item -ItemType Directory -Force release
          Copy-Item "artifacts\installer\MegaCopier-Setup-$env:VERSION.exe" $out
          # Portátil: la app y mcopy en una carpeta, con portable.txt (los ajustes van a Data\, al lado).
          $portable = New-Item -ItemType Directory -Force "portable\MegaCopier"
          Copy-Item artifacts\app\* $portable -Recurse -Exclude *.pdb
          Copy-Item artifacts\cli\mcopy.exe $portable
          New-Item -ItemType File "$portable\portable.txt" | Out-Null
          Compress-Archive -Path $portable -DestinationPath "$out\MegaCopier-$env:VERSION-portable.zip"
          Copy-Item artifacts\cli\mcopy.exe "$out\mcopy-$env:VERSION.exe"
          dotnet run tools/Updates/notes.cs -- $env:VERSION release --require-summary
          if ($LASTEXITCODE -ne 0) { throw 'Faltan las notas bilingües.' }
          # El cuerpo bilingüe es para la página; los assets separados son para el idioma elegido por la app.
          Move-Item "$out\release-body.md" notes.md
          $files = Get-ChildItem $out # antes de crear SHA256SUMS.txt, que no se incluye a sí mismo
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } |
            Out-File "$out\SHA256SUMS.txt" -Encoding ascii

      - name: Firmar el manifiesto del actualizador
        shell: pwsh
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.MEGACOPIER_UPDATE_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_PRIVATE_KEY)) { throw 'Falta el secreto MEGACOPIER_UPDATE_PRIVATE_KEY.' }
          $privatePath = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString() + '.pem')
          try {
            [IO.File]::WriteAllText($privatePath, $env:UPDATE_PRIVATE_KEY)
            dotnet run tools/Updates/sign.cs -- sign $env:VERSION release $privatePath tools/Updates/public-key.pem
            if ($LASTEXITCODE -ne 0) { throw 'No se pudo firmar el manifiesto.' }
          } finally {
            Remove-Item -LiteralPath $privatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Publicar
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem release).FullName --title "MegaCopier $env:VERSION" --notes-file notes.md
