name: Compilación

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Inno Setup
        shell: powershell
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Compilar y probar
        shell: powershell
        run: .\build.ps1

      # Comprueba el instalador, pero no lo distribuye desde las compilaciones de desarrollo.
      # Los paquetes descargables se publican únicamente mediante una etiqueta de versión autorizada.
